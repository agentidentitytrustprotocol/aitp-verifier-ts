name: Release

# Publishes @agentidentitytrustprotocol/verifier to npm with provenance.
# Provenance is signed with this job's GitHub OIDC token. The upload itself
# authenticates with the org NPM_TOKEN for now, because npm's OIDC exchange
# rejects this repo's immutable `sub` claim: npm/cli#9969
# (https://github.com/npm/cli/issues/9969). Switching back to trusted
# publishing is tracked in #12. See scripts/handoff/npm-trusted-publisher.md.
#
# * pull_request, push to main -> pack, smoke-test the tarball, publish --dry-run.
# * tag `v*` pushed            -> the same, then publish that exact tarball
#                                 (environment `npm`) unless the version is
#                                 already on the registry, and verify what
#                                 the registry serves (#11).
#
# Every action is pinned by commit SHA: this workflow holds publish rights.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (pack, smoke test, publish dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Fails closed: a tag that is not `v` + the package version publishes nothing.
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package version $version (expected v$version)"
            exit 1
          fi
      - run: npm ci
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"
      # The tarball, installed into an empty project outside the checkout:
      # the library imports, and the adapter bin answers init through npx
      # with the build's commit, its KAT keys coming from the package.
      - name: Smoke-test the tarball in a clean project
        run: |
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/pack/*.tgz
          node --input-type=module -e '
            import { verifyEnvelope, ERROR_REGISTRY } from "@agentidentitytrustprotocol/verifier";
            if (typeof verifyEnvelope !== "function" || Object.keys(ERROR_REGISTRY).length === 0) process.exit(1);
          '
          reply=$(printf '%s\n' '{"id":"r1","op":"init","params":{"version":"1"}}' '{"id":"r2","op":"shutdown","params":{}}' | npx --no-install aitp-verifier-adapter | head -1)
          echo "$reply"
          printf '%s' "$reply" | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!r.ok || r.result.implementation !== "aitp-verifier-ts" || r.result.commit !== process.env.GITHUB_SHA) process.exit(1);
          '
      # The same relative tarball path the publish job uses. npm refuses even
      # a dry run over a published version, so once this version is out the
      # dry run waits for the next version bump.
      - name: Publish dry run
        run: |
          set +e
          node scripts/verify-published.mjs "$RUNNER_TEMP"/pack/*.tgz --exists
          rc=$?
          set -e
          case $rc in
            0) echo "::notice::this version is already published; bump it in package.json before the next release" ;;
            3) cd "$RUNNER_TEMP" && npm publish ./pack/*.tgz --dry-run --access public ;;
            *) exit "$rc" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  publish:
    name: publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@agentidentitytrustprotocol/verifier
    permissions:
      contents: read
      id-token: write # provenance (OIDC); trusted publishing once npm/cli#9969 is fixed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify-published.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pack
      - name: npm is new enough for provenance and trusted publishing
        run: |
          v=$(npm --version); echo "npm $v"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v"
      # A re-run of a published tag never publishes again: it only verifies.
      - name: Already on the registry?
        id: registry
        run: |
          set +e
          node scripts/verify-published.mjs pack/*.tgz --exists
          rc=$?
          set -e
          case $rc in
            0) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      # `./`: a bare `pack/x.tgz` is read as GitHub `user/repo` shorthand.
      # NODE_AUTH_TOKEN is the npm/cli#9969 workaround and lives on this step
      # only; drop it when #12 switches back to OIDC trusted publishing.
      # npm can refuse with E409 for a version it accepted moments ago but
      # does not serve yet (#11); that is left to the verify step to settle.
      - name: Publish with provenance
        if: steps.registry.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          npm publish ./pack/*.tgz --provenance --access public 2>&1 | tee "$RUNNER_TEMP/publish.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -Eq 'E409|previously (published|staged)' "$RUNNER_TEMP/publish.log" || exit "$rc"
            echo "::notice::npm reports this version as already submitted; verifying it on the registry"
          fi
      # The job's real result: what the registry serves, with bounded backoff
      # for npm's processing lag. The same tarball (integrity, or contents if
      # a re-run compressed it differently), its provenance, and latest.
      - name: Verify on the registry
        run: node scripts/verify-published.mjs pack/*.tgz --budget-secs 600
