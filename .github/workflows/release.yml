name: Release

# Publishes @agentidentitytrustprotocol/verifier to npm with OIDC trusted
# publishing and provenance: no npm token is used. The npmjs.com side (the
# trusted publisher for this repo and workflow) is a one-time owner action;
# see scripts/handoff/npm-trusted-publisher.md.
#
# * pull_request, push to main -> pack, smoke-test the tarball, publish --dry-run.
# * tag `v*` pushed            -> the same, then publish that exact tarball
#                                 (environment `npm`).
#
# Every action is pinned by commit SHA: this workflow holds publish rights.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (pack, smoke test, publish dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Fails closed: a tag that is not `v` + the package version publishes nothing.
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package version $version (expected v$version)"
            exit 1
          fi
      - run: npm ci
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"
      # The tarball, installed into an empty project outside the checkout:
      # the library imports, and the adapter bin answers init through npx
      # with the build's commit, its KAT keys coming from the package.
      - name: Smoke-test the tarball in a clean project
        run: |
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/pack/*.tgz
          node --input-type=module -e '
            import { verifyEnvelope, ERROR_REGISTRY } from "@agentidentitytrustprotocol/verifier";
            if (typeof verifyEnvelope !== "function" || Object.keys(ERROR_REGISTRY).length === 0) process.exit(1);
          '
          reply=$(printf '%s\n' '{"id":"r1","op":"init","params":{"version":"1"}}' '{"id":"r2","op":"shutdown","params":{}}' | npx --no-install aitp-verifier-adapter | head -1)
          echo "$reply"
          printf '%s' "$reply" | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!r.ok || r.result.implementation !== "aitp-verifier-ts" || r.result.commit !== process.env.GITHUB_SHA) process.exit(1);
          '
      - name: Publish dry run
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --dry-run --access public
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  publish:
    name: publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@agentidentitytrustprotocol/verifier
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance (OIDC)
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: pack
      - name: npm is new enough for trusted publishing
        run: |
          v=$(npm --version); echo "npm $v"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$v"
      - name: Publish with provenance
        run: npm publish pack/*.tgz --provenance --access public
