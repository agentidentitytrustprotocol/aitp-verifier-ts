name: bump-spec
# Adopt a new AITP spec revision. Dispatched by the spec repo's
# notify-spec-consumers on a conformance-relevant push; also runnable
# manually. The spec SHA lives in SPEC_VERSION, so bump-spec-ref runs in file
# mode, and its post-bump step regenerates vendor/spec and src/errors.ts from
# the spec at the new pin so the PR is complete. The PR is HELD, never
# auto-merged: adopting a spec is a reviewed change, not a bot's.
on:
  repository_dispatch:
    types: [spec-released]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Spec SHA (blank = event payload / spec HEAD)'
        required: false
        default: ''
jobs:
  bump:
    uses: agentidentitytrustprotocol/aitp-ci/.github/workflows/bump-spec-ref.yml@fe53310ca469e5b7d53cee52f6a7b7d5f4e5521d # v1
    with:
      mode: file
      file: SPEC_VERSION
      sha: ${{ github.event.inputs.sha }}
      # Runs at the repo root after SPEC_VERSION is rewritten. The scripts
      # need only node; the spec clone lives outside the tree.
      post-bump: >-
        d=$(mktemp -d) &&
        git clone -q --filter=blob:none https://github.com/agentidentitytrustprotocol/agentidentitytrustprotocol "$d" &&
        git -C "$d" checkout -q "$(tr -d '[:space:]' < SPEC_VERSION)" &&
        node scripts/sync-spec.mjs --spec-dir "$d" &&
        node scripts/gen-errors.mjs &&
        rm -rf "$d"
    secrets: inherit
